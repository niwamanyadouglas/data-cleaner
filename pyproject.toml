[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaner"
version = "0.2.0"
description = "Automated cleaning for messy CSV and Excel files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Niwamanya Douglas"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[project.scripts]
# Points to the main() function inside cleaner/main.py
data-cleaner = "cleaner.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Only package the 'cleaner' folder
[tool.setuptools.packages.find]
include = ["cleaner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
